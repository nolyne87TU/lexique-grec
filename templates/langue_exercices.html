{% extends "base.html" %}

{% block titre %}Exercices de langue – Lexique grec{% endblock %}

{% block classe_main %}moyen{% endblock %}

{% block contenu %}
<h1 class="titre-revision">Exercices de langue</h1>

<div id="entrainement"
     data-langue="{{ url_for('langue_accueil') }}"
     data-supprimer="{{ url_for('supprimer_exercice', id=0) }}"
     data-point="{{ point_initial }}"></div>

<script id="donnees" type="application/json">{{ donnees | tojson }}</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='langue.js') }}"></script>
{% endblock %}
